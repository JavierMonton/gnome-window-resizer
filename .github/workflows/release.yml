name: Release Extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gettext zip

      - name: Extract version from tag
        id: version
        run: |
          # Get version from tag (e.g., v2 -> 2)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version in metadata.json
        run: |
          # Update version number in metadata.json
          sed -i 's/"version": [0-9]*/"version": ${{ steps.version.outputs.version }}/' metadata.json

      - name: Build extension
        run: make build

      - name: Create extension package
        run: |
          make package
          # Rename to include version
          mv gnome-window-resizer-v*.zip gnome-window-resizer-v${{ steps.version.outputs.version }}.zip

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          files: gnome-window-resizer-v${{ steps.version.outputs.version }}.zip

      - name: Publish to GNOME Extensions
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          # Skip when EGO credentials are not configured in repo secrets
          if [ -z "$EGO_USERNAME" ] || [ -z "$EGO_PASSWORD" ]; then
            echo "EGO_USERNAME/EGO_PASSWORD secrets not set, skipping publish"
            exit 0
          fi

          # Official EGO API (https://extensions.gnome.org/api/docs/)
          LOGIN_URL="https://extensions.gnome.org/api/v1/accounts/login/"
          UPLOAD_URL="https://extensions.gnome.org/api/v1/extensions"
          ZIP_FILE="gnome-window-resizer-v${{ steps.version.outputs.version }}.zip"

          # Authenticate and get an API token
          TOKEN=$(curl -sSf -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json" \
            --data-urlencode "login=${EGO_USERNAME}" \
            --data-urlencode "password=${EGO_PASSWORD}" \
            "$LOGIN_URL" | jq -r '.token.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::EGO login failed - check EGO_USERNAME/EGO_PASSWORD secrets"
            exit 1
          fi

          # Submit the zip for review (same checkboxes as the web upload form)
          HTTP_CODE=$(curl -s -o ego_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Token ${TOKEN}" \
            -F "source=@${ZIP_FILE}" \
            -F "shell_license_compliant=true" \
            -F "tos_compliant=true" \
            "$UPLOAD_URL")

          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::EGO upload failed (HTTP ${HTTP_CODE}):"
            cat ego_response.json
            exit 1
          fi

          echo "Extension submitted to extensions.gnome.org (pending review)"

